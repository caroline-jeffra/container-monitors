global:
  scrape_interval:     15s

scrape_configs:
  - job_name: 'docker'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container_name
      - source_labels: [__meta_docker_container_label_com_docker_swarm_service]
        target_label: swarm_service
      - source_labels: [__meta_docker_container_name]
        regex: '^/container-monitors-(tempo|promtail|loki|grafana|prometheus|cadvisor)-\d+$'
        action: drop